[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "headrouter"
version = "0.1.0"
description = "Stateless OpenAI-compatible gateway with Headroom context compression and multi-provider routing"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
compression = ["headroom-ai>=0.36"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools]
py-modules = ["app", "config", "schemas", "compression"]

[tool.setuptools.packages.find]
include = ["adapters*", "middleware*", "routes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
