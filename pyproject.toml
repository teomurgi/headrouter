[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "headrouter"
version = "0.2.2"
description = "Stateless OpenAI-compatible gateway with Headroom context compression and multi-provider routing"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "headroom-ai[ml]>=0.36",
    # onnxruntime dropped Intel (x86_64) macOS wheels after 1.23.x; only arm64
    # mac builds exist for >=1.24. Pin Intel Macs to the last available build.
    "onnxruntime>=1.24; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "onnxruntime>=1.23,<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
tray = ["pystray>=0.19", "pillow>=10"]

[project.scripts]
headrouter-gateway = "gateway_launcher:main"
headrouter-tray = "tray_app:main"

[tool.setuptools]
py-modules = ["app", "config", "config_store", "schemas", "compression_service", "request_log", "gateway_launcher", "tray_app"]

[tool.setuptools.packages.find]
include = ["adapters*", "middleware*", "routes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
