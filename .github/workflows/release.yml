name: Release bundles

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # Create (or reuse) the GitHub Release for the tag exactly once, before any
  # matrix job tries to upload assets. Without this, concurrent matrix jobs
  # race to create the same release and one of them fails with
  # "422 Validation Failed" during the asset-upload step.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version for dispatch runs
        id: version
        run: echo "version=$(grep -m1 '^version' pyproject.toml | sed -E 's/version = \"(.*)\"/\1/')" >> "$GITHUB_OUTPUT"

      - name: Create release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # On tag pushes the tag is inferred from the ref; on manual
          # workflow_dispatch runs there is no tag, so fall back to the
          # version in pyproject.toml (prefixed with "v").
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version) }}

  macos:
    needs: create-release
    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(grep -m1 '^version' pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # pyproject.toml requires a PEP 440 version; tags like "v1.2.3-rc1"
          # aren't valid as-is, so any non-numeric suffix becomes a "+local"
          # segment (e.g. "1.2.3-rc1" -> "1.2.3+rc1"), which PEP 440 allows.
          PY_VERSION="${VERSION/-/+}"
          perl -pi -e "s/^version = \".*\"/version = \"$PY_VERSION\"/" pyproject.toml
          perl -pi -e "s/(\"CFBundleShortVersionString\": )\".*\"/\$1\"$VERSION\"/" packaging/macos/tray_macos.spec
          perl -pi -e "s/(\"CFBundleVersion\": )\".*\"/\$1\"$VERSION\"/" packaging/macos/tray_macos.spec

      - name: Build project venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e . pyinstaller

      - name: Generate icon.icns
        run: |
          mkdir -p icon.iconset
          sips -z 512 512 static/icon.png --out icon.iconset/icon_512x512.png
          sips -z 256 256 static/icon.png --out icon.iconset/icon_256x256.png
          iconutil -c icns icon.iconset -o packaging/macos/icon.icns

      - name: Build .app bundle
        run: ./packaging/macos/build-app.sh

      - name: Zip .app bundle
        run: |
          cd packaging/dist
          ditto -c -k --sequesterRsrc --keepParent Headrouter.app "Headrouter-${VERSION}-macos-${{ matrix.arch }}.zip"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/dist/Headrouter-*-macos-*.zip

  linux:
    needs: create-release
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        pkg: [deb, rpm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # PyInstaller freezes torch/onnxruntime/headroom-ai into the gateway
          # binary, which needs more free space than ships on the runner by
          # default; reclaim space by dropping preinstalled toolchains we
          # don't use for this build.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - name: Install system tray dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-venv \
            python3-gi \
            gir1.2-ayatanaappindicator3-0.1 \
            gir1.2-gtk-3.0 \
            libayatana-appindicator3-1

      - name: Install rpm toolchain
        if: matrix.pkg == 'rpm'
        run: sudo apt-get install -y rpm

      - name: Set version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(grep -m1 '^version' pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
          fi
          PY_VERSION="${VERSION/-/+}"
          perl -pi -e "s/^version = \".*\"/version = \"$PY_VERSION\"/" pyproject.toml
          if [[ "${{ matrix.pkg }}" == "deb" ]]; then
            perl -pi -e "s/^Version: .*/Version: $VERSION/" packaging/ubuntu/control
          else
            # rpmbuild versions cannot contain '-'; 0.0.4-test -> 0.0.4~test
            echo "${VERSION/-/~}" > packaging/fedora/version
          fi

      - name: Build project venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          # On aarch64 PyPI serves the CUDA-bundled torch wheel (pulls in ~50
          # nvidia_* packages), which PyInstaller then freezes into the gateway
          # binary and pushes the package past GitHub's 2 GB release-asset limit.
          # This gateway does CPU-only inference, so install the CPU-only torch
          # wheel first; pip then keeps it when resolving headroom-ai[ml].
          .venv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/pip install -e . pyinstaller

      - name: Build .deb package
        if: matrix.pkg == 'deb'
        run: ./packaging/ubuntu/build-deb.sh

      - name: Build .rpm package
        if: matrix.pkg == 'rpm'
        run: ./packaging/fedora/build-rpm.sh

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/ubuntu/build/*.deb
            packaging/fedora/build/*.rpm
